<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BERU Game Guide</title>
  <style>
    :root{--bg:#05040b;--text:#f4f1ff;--purple:#b47cff;--border:#6f48a4}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS",Arial,sans-serif}a{color:inherit;text-decoration:none}
    .site{min-height:100vh;overflow:hidden;position:relative;background:linear-gradient(rgba(5,4,11,.72),rgba(5,4,11,.95)),repeating-linear-gradient(115deg,transparent 0 70px,rgba(157,104,255,.025) 71px 72px),radial-gradient(circle at 50% 12%,#2b1551 0,#10091e 30%,#05040b 65%)}
    .site:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 80%)}
    header{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,6vw,90px);border-bottom:1px solid rgba(174,126,255,.18);background:rgba(5,4,11,.68);backdrop-filter:blur(16px);position:relative;z-index:3}.brand{display:flex;align-items:center;gap:12px;letter-spacing:.15em}.mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid #9c69ef;transform:rotate(45deg);color:#c8a5ff;box-shadow:0 0 20px #9751ff4d;font:700 19px Georgia,serif}.mark i{font-style:normal;transform:rotate(-45deg)}.brand strong,.brand small{display:block}.brand strong{font-size:15px}.brand small{color:#8c819c;font-size:9px;margin-top:3px}.community{color:#70677e;font-size:11px;letter-spacing:.22em}
    main{width:min(980px,calc(100% - 36px));margin:auto;padding:90px 0 72px;position:relative;z-index:2;text-align:center}.eyebrow{margin:0 0 16px;color:#9c70df;font-size:12px;letter-spacing:.28em}h1{margin:0;font:500 clamp(3.2rem,8vw,6.5rem)/1 Georgia,serif;letter-spacing:-.045em;text-shadow:0 0 50px #7539d238}h1 span{color:var(--purple);font-style:italic}.intro{margin:18px 0 48px;color:#aea5bb;font-size:17px}.rank{position:absolute;top:44px;right:1%;color:#b984ff0b;font:700 260px/1 Georgia,serif;transform:rotate(7deg);user-select:none}
    nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;text-align:left}.card{position:relative;min-height:118px;display:grid;grid-template-columns:48px 62px 1fr 24px;align-items:center;gap:16px;padding:18px 22px;overflow:hidden;border:1px solid #a370e952;border-left:3px solid #7d47ca;background:linear-gradient(105deg,#1a112af0,#0a0811d1);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:.22s}.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--purple);background:linear-gradient(105deg,#271743fa,#0d0917e6);box-shadow:0 12px 38px #2a10516b;outline:none}.index{color:#645872;font:12px monospace;align-self:start;margin-top:4px}.icon{width:58px;height:58px;display:grid;place-items:center;color:#c6a1ff;border:1px solid #614190;background:#6834b41f;font:28px Georgia,serif;transform:rotate(45deg)}.icon i{font-style:normal;transform:rotate(-45deg)}.copy strong{display:block;text-transform:uppercase;font:600 20px Georgia,serif;letter-spacing:.09em}.copy small{display:block;margin-top:8px;color:#93899f;font-size:13px;line-height:1.35}.arrow{color:#7e639d;font-size:30px;transition:.2s}.card:hover .arrow{color:#d2b6ff;transform:translateX(3px)}
    footer{max-width:980px;margin:auto;padding:20px 0 32px;border-top:1px solid #9b70dc21;display:flex;justify-content:space-between;color:#51495c;font-size:10px;letter-spacing:.18em;position:relative;z-index:2}
    @media(max-width:700px){.community{display:none}header{height:70px}main{padding-top:66px}.rank{font-size:180px;top:35px}nav{grid-template-columns:1fr}.card{min-height:105px;grid-template-columns:30px 50px 1fr 18px;gap:13px;padding:16px}.icon{width:48px;height:48px;font-size:23px}.copy strong{font-size:17px}footer{margin:0 18px}footer span:last-child{display:none}}
  </style>
</head>
<body>
<div class="site">
  <header><a class="brand" href="#"><span class="mark"><i>B</i></span><span><strong>BERU</strong><small>GAME GUIDE</small></span></a><span class="community">DISCORD BOT COMPENDIUM</span></header>
  <main><div class="rank">B</div><p class="eyebrow">SYSTEM ARCHIVE // ACCESS GRANTED</p><h1>Welcome, <span>Hunter.</span></h1><p class="intro">Choose a category to explore the game guide.</p>
    <nav id="categories"></nav>
  </main>
  <footer><span>PLAYER GUIDE DATABASE</span><span>INSPIRED BY SOLO LEVELING</span></footer>
</div>
<script>
  // Edit this list to rename, add, or remove homepage categories.
  const sections=[
    ["Artifacts","◆","Artifact sets, stats, and enhancement details.","artifacts.html"],
    ["Weapons","⚔","Weapon rarities, Power, and Advancement.","weapons.html"],
    ["Shadows","♟","Shadow collection, ranks, and abilities.","shadows.html"],
    ["Dungeons","⛩","Dungeon encounters, rewards, and progression.","dungeons.html"],
    ["Raids","☠","Raid encounters, phases, and rewards.","raids.html"],
    ["Coming Soon","♛","Guild boss mechanics and battle information.","#"],
    ["Cores","◉","Workshop of Brilliant Light Droprates & Core stats.","cores.html"],
    ["Guides","📖","Guides for commands, gameplay, and efficient growth.","guides.html"]
  ];
  document.querySelector("#categories").innerHTML=sections.map((s,i)=>`<a class="card" href="${s[3]}"><span class="index">0${i+1}</span><span class="icon"><i>${s[1]}</i></span><span class="copy"><strong>${s[0]}</strong><small>${s[2]}</small></span><span class="arrow">›</span></a>`).join("");
</script>
</body>
</html>
